name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest
      - run: pip install -e sdk -e mcp-server
      - run: ./scripts/prepare-searxng.sh
      - run: pytest tests -q
      - run: python -m compileall app adapters mcp-server/agent_search_mcp scripts sdk -q
      - run: docker compose config --quiet